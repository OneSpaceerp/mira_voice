# Mira Desk + API entry point (ADR 0012). Host networking: ufw applies (80/443 open).
#   :80   redirects to HTTPS
#   :443  the Desk (single-page app) and /api -> Mira Core on 127.0.0.1:8000
# The certificate is /opt/mira/config/tls (self-signed until task 2.6), mounted read-only.

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    ssl_certificate /run/mira-config/tls/mira.crt;
    ssl_certificate_key /run/mira-config/tls/mira.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mira:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    # prompt uploads are capped at 12 MB by Mira Core
    client_max_body_size 13m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers on every response, also in locations that add their own headers.
    # No HSTS yet: with a self-signed certificate it would lock browsers out (task 2.6).
    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Vite puts a content hash in every asset name: cache them for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the app: every other path is a client-side route
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # container health check (compose), from this machine only
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
