# Mira Voice — Kamailio TLS profiles (SIP over TLS on 5061 and WSS on 8089).
# The certificate is self-signed by deploy/install.sh until a real one is installed (task 2.6).

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/mira.key
certificate = /etc/kamailio/tls/mira.crt

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
