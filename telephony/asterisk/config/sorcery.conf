; Mira Voice — where PJSIP objects come from.
; 1. pjsip.conf (transport, templates, lab extensions from deploy/lab-extensions.sh)
; 2. realtime: read-only views over Mira Core's tables (extensions, trunks) — task 1.1.
; Contacts (registrations) stay in astdb, not in PostgreSQL.
[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=realtime,ps_endpoints
auth=config,pjsip.conf,criteria=type=auth
auth=realtime,ps_auths
aor=config,pjsip.conf,criteria=type=aor
aor=realtime,ps_aors
