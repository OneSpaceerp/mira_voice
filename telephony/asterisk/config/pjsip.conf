; Mira Voice — PJSIP.
; Asterisk is never reached directly: Kamailio (the SIP edge) forwards to 127.0.0.1:5080
; and RTPengine relays media to Asterisk's RTP on 127.0.0.1.
; Extensions come from PostgreSQL (realtime views, sorcery.conf); trunks from the file Mira
; Core generates (generated/pjsip_mira.conf); lab extensions from deploy/lab-extensions.sh.

[global]
type = global
user_agent = Mira Voice
; "ip" first: it is the identify module, which also matches the X-Mira-Trunk header that only
; Kamailio adds, for calls from a known carrier IP (task 1.2). Everything reaches Asterisk
; from 127.0.0.1, so there is no "match" on addresses here.
endpoint_identifier_order = ip,auth_username,username
default_from_user = mira

[system]
type = system

[transport-kamailio]
type = transport
protocol = udp
bind = 127.0.0.1:5080
allow_reload = yes

; ---- templates used by generated endpoints ----

[mira-endpoint](!)
type = endpoint
transport = transport-kamailio
context = mira-lab
disallow = all
allow = ulaw,alaw,g722
direct_media = no
rtp_symmetric = no
force_rport = no
rewrite_contact = no
ice_support = no
media_encryption = no
media_address = 127.0.0.1
bind_rtp_to_media_address = yes
dtmf_mode = rfc4733
send_pai = yes
trust_id_inbound = no
language = en

[mira-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
remove_unavailable = yes
qualify_frequency = 30
support_path = yes

[mira-auth](!)
type = auth
auth_type = digest

#tryinclude mira/pjsip_lab.conf
; Trunks (carriers, GSM gateways): generated by Mira Core from the database (task 1.2)
#tryinclude generated/pjsip_mira.conf
