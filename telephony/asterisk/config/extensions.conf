; Mira Voice — lab dialplan (task 0.3). Phase 1 replaces this with dialplan generated by
; Mira Core and call control over ARI.
[general]
static = yes
writeprotect = yes

[mira-lab]
; extension to extension
exten => _1XXX,1,NoOp(Mira lab call ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; 600: echo test — you hear yourself (checks audio both ways with one phone)
exten => 600,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 609: echo without the spoken prompt — used by automated tests
exten => 609,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 601: hello world — one-way audio check (Asterisk -> phone)
exten => 601,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Hangup()

; 602: same in French
exten => 602,1,Answer()
 same => n,Set(CHANNEL(language)=fr)
 same => n,Wait(0.5)
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Hangup()

exten => i,1,Hangup()
exten => t,1,Hangup()
exten => _X.,1,Playback(pbx-invalid)
 same => n,Hangup()

[default]
exten => _X.,1,Hangup()

; ---- used by the generated dialplan (Mira Core writes generated/extensions_mira.conf) ----

; Call an extension: ARG1 = PJSIP endpoint (the extension's SIP username)
[mira-dial-extension]
exten => s,1,NoOp(Mira: ${CALLERID(num)} -> ${ARG1} (tenant ${CHANNEL(tenantid)}))
 same => n,Dial(PJSIP/${ARG1},30)
 same => n,Return()

; A number that does not exist in this tenant
[mira-unknown-number]
exten => s,1,Answer()
 same => n,Wait(0.3)
 same => n,Playback(pbx-invalid)
 same => n,Hangup()

; Call out through trunks, in order (task 1.2).
; ARG1 = number to send; then pairs ARG2/ARG3, ARG4/ARG5 ... = trunk endpoint / caller ID
; ("" = the trunk default, else the caller's own). The next trunk is tried only when this one
; is unreachable or congested — never after a busy or unanswered call.
[mira-outbound]
exten => s,1,Set(LOCAL(n)=2)
 same => n,Set(LOCAL(own_cid)=${CALLERID(num)})
 same => n(next),GotoIf($["${ARG${n}}" = ""]?failed)
 same => n,Set(LOCAL(trunk)=${ARG${n}})
 same => n,Set(LOCAL(cid)=${ARG$[${n} + 1]})
 same => n,Set(CALLERID(num)=${IF($["${cid}" != ""]?${cid}:${own_cid})})
 same => n,NoOp(Mira out: ${ARG1} via ${trunk} as ${CALLERID(num)} (tenant ${CHANNEL(tenantid)}))
 same => n,Dial(PJSIP/${ARG1}@${trunk},90)
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?retry)
 same => n,Return()
 same => n(retry),Set(LOCAL(n)=$[${n} + 2])
 same => n,Goto(next)
 ; every trunk failed: 34 = "no circuit available" (the caller's phone shows it)
 same => n(failed),Hangup(34)

#tryinclude generated/extensions_mira.conf
