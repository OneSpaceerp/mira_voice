; Mira Voice — module loading. PJSIP only; SIP is terminated by Kamailio in front.
[modules]
autoload = yes

; Realtime (PJSIP objects from PostgreSQL) needs ODBC before res_pjsip loads.
preload => res_odbc.so
preload => res_config_odbc.so

; Kamailio handles WebSocket and TLS from clients; Asterisk only speaks UDP on 127.0.0.1.
noload => res_pjsip_transport_websocket.so
; Not used by Mira
noload => chan_iax2.so
noload => chan_unistim.so
noload => res_pjsip_phoneprov.so
noload => res_phoneprov.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_sqlite3_custom.so
noload => pbx_dundi.so
noload => res_config_ldap.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
; Not used: CDR/CEL go to Mira Core through ARI events, AMI is off, no Festival/AEL/calendar.
noload => cdr_csv.so
noload => cel_manager.so
noload => app_festival.so
noload => app_followme.so
noload => pbx_ael.so
noload => res_calendar.so
noload => res_stun_monitor.so
; Prometheus metrics come with monitoring (Phase 2.7); off until then.
noload => res_prometheus.so
; Agents are queue members managed by Mira Core, not chan_agent-style agents.
noload => app_agent_pool.so
noload => app_alarmreceiver.so
noload => res_pjsip_phoneprov_provider.so
noload => res_config_sqlite3.so
noload => res_clialiases.so
noload => res_statsd.so
; AI speech (res_aeap) and outbound WebSocket channels come with Phase 3 AI work.
noload => res_aeap.so
noload => res_speech_aeap.so
noload => chan_websocket.so
; ODBC is only for realtime PJSIP (res_config_odbc): no CDR/CEL/func over ODBC, no MiniVM.
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cel_odbc.so
noload => func_odbc.so
noload => app_minivm.so
